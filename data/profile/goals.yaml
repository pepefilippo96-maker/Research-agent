# Obiettivi economici e personali dell'utente (vedi CLAUDE.md, regola 6 e Fase 4).
# Ogni annuncio in data/jobs/jobs.json viene verificato rispetto a questi valori
# prima di passare alla generazione del CV.
#
# STATO: vuoto, in attesa che l'utente definisca i propri obiettivi (Fase 1 non
# ancora eseguita).

economic:
  ral_minimum: null      # RAL minima accettabile (non negoziabile)
  ral_target: null       # RAL target desiderata
  currency: null         # es. EUR, USD
  non_negotiable_benefits: []   # es. equity, welfare, ticket, smart working

personal:
  culture_preferences: []   # tipo di cultura aziendale ricercata
  values: []                 # mission/temi a cui l'utente tiene (es. sostenibilità)
  avoid_sectors: []          # settori da evitare
  avoid_practices: []        # pratiche aziendali da evitare
